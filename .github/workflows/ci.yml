name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions fixadas por SHA: tag pode ser movida, commit não
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: testes + cobertura
        run: go test -race -count=1 -v -coverprofile=cover.out ./...
      - name: gate de 100% de cobertura
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "cobertura: $total"
          [ "$total" = "100.0%" ] || { go tool cover -func=cover.out | grep -v '100.0%'; exit 1; }
      - name: smoke test (compose + remetente em Go)
        run: |
          export WEBHOOK_SECRET=$(openssl rand -hex 32) FORWARD_SECRET=$(openssl rand -hex 32)
          docker compose up -d --build --wait
          NONCE=evt_ci go run ./examples/sender | grep '200 OK'
          # mesmo nonce de novo: o relay tem q recusar com 409
          (NONCE=evt_ci go run ./examples/sender || true) | grep '409 Conflict'
          # o destino recebeu o repasse assinado pelo relay
          docker compose logs destino | grep '"x-webhook-signature": "sha256='
