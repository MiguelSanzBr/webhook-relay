services:
  relay:
    build: .
    # só no localhost: a demo não fica exposta na rede
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # sem padrão de propósito: segredo de demo no GitHub é segredo público
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET, ex. export WEBHOOK_SECRET=$(openssl rand -hex 32)}
      FORWARD_SECRET: ${FORWARD_SECRET:?defina FORWARD_SECRET, ex. export FORWARD_SECRET=$(openssl rand -hex 32)}
      TARGET_URL: http://destino:8080/
    depends_on:
      destino:
        condition: service_started
    restart: unless-stopped
    # o shutdown espera até 25 s (leitura + TIMEOUT + folga); com o padrão de 10 s o docker matava antes
    stop_grace_period: 30s

  # destino de demo: só ecoa no log o que o relay repassou, com os headers assinados pelo relay
  destino:
    image: mendhak/http-https-echo:42@sha256:a265f55c86cb3baead76fdf379dc8e9e6440ed121874e101e60b833e05bce8d4
    environment:
      HTTP_PORT: 8080
